<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Botanical Certification | Ask of Pablo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdfbf7; font-family: 'Lora', serif; }
        .cert-border { border: 10px double #4a5d4e; }
    </style>
</head>
<body class="p-12 flex justify-center">
    <div class="max-w-3xl w-full bg-white p-12 cert-border shadow-xl text-center">
        <h1 class="text-4xl font-bold text-green-900 mb-4" style="font-family: 'Playfair Display', serif;">Certificate of Purity</h1>
        <p class="text-xl mb-8 italic">This document certifies that the batch listed below meets the highest standards of organic potency.</p>
        <div class="text-left space-y-4 mb-12 max-w-md mx-auto border-t border-b border-stone-200 py-8">
            <p><strong>Strain:</strong> Ancient Forest Kush</p>
            <p><strong>Batch ID:</strong> APK-2026-004</p>
            <p><strong>Purity:</strong> 99.4%</p>
            <p><strong>Harvest Date:</strong> August 12, 2026</p>
        </div>
        <div class="flex justify-between items-end">
            <div class="text-center">
                <div class="h-12 w-40 border-b border-black mb-2"></div>
                <p class="text-xs uppercase">Laboratory Analyst</p>
            </div>
            <div class="text-center">
                <div class="h-12 w-40 border-b border-black mb-2"></div>
                <p class="text-xs uppercase">Master Grower</p>
            </div>
        </div>
    </div>
</body>
</html>
